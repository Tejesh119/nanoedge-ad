# NanoEdge-AD Configuration
project_name: "nanoedge-ad"
version: "1.0.0"

seeds:
  - 42
  - 101
  - 777
primary_seed: 42

data:
  channels:
    - "temperature"
    - "vibration_x"
    - "vibration_y"
    - "pressure"
  sample_rate_hz: 100
  total_samples: 220000
  anomaly_ratio_target: 0.12  # ~12% anomalous samples in timeline
  synthetic: true
  anomaly_types:
    - "spike"
    - "drift"
    - "stuck_at"
    - "noise_burst"
    - "dropout"

windowing:
  window_size: 64
  stride: 32
  anomaly_overlap_ratio: 0.10  # Window anomalous if >= 10% samples are anomalous
  splits:
    train: 0.60
    val: 0.20
    test: 0.20

model:
  name: "TCN_SensorGate"
  input_shape: [64, 4]
  num_classes: 2
  gate_l1: 0.001
  blocks:
    - filters: 16
      kernel_size: 3
      dilation_rate: 1
    - filters: 16
      kernel_size: 3
      dilation_rate: 2
    - filters: 24
      kernel_size: 3
      dilation_rate: 4
  dense_units: 2

training:
  batch_size: 64
  epochs: 25
  learning_rate: 0.001
  early_stopping_patience: 6
  channel_masking_prob: 0.25  # Probability of masking 1-3 channels during training

quantization:
  num_calibration_samples: 600
  inference_type: "int8"
  tolerance_f1_drop: 0.03  # Acceptance criterion: <= 3 points drop
  min_agreement_ratio: 0.95

pruning:
  quiet_window_count: 5
  jump_z_threshold: 2.8
  low_gate_threshold: 0.55
  monte_carlo_draws: 25

benchmark:
  warmup_runs: 50
  host_benchmark_runs: 1000
  energy_proxy:
    # ASSUMPTION: 3.3V IoT sensor node with typical I2C peripheral read and MCU inference energy
    e_read_uj: 12.0     # uJ per single-channel sensor read
    e_infer_uj: 45.0    # uJ per int8 TCN inference
  mcu_hardware:
    cortex_m4:
      name: "ARM Cortex-M4 (STM32L4)"
      clock_mhz: 80
      assumed_macs_per_cycle: 0.8
    esp32:
      name: "Espressif ESP32"
      clock_mhz: 240
      assumed_macs_per_cycle: 1.0

paths:
  outputs_dir: "outputs"
  docs_dir: "docs"
  model_fp32: "outputs/model_fp32.keras"
  model_int8: "outputs/model_int8.tflite"
  gates_json: "outputs/gates.json"
  quant_info: "outputs/quant_info.json"
  test_windows: "outputs/test_windows.npz"
  metrics_json: "outputs/metrics.json"
  results_csv: "outputs/results.csv"
  results_md: "outputs/results.md"
  paper_draft: "outputs/paper_draft.md"
